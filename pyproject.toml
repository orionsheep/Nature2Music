[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nature2music"
version = "0.1.0"
description = "Fun-ASR assisted bioacoustic recognition and ThinkSound music generation pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Nature2Music contributors"}]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
asr = [
  "funasr>=1.3.26",
  "torch>=2.9",
  "torchaudio>=2.9",
  "transformers>=4.51.3",
]
lora = ["peft>=0.15", "accelerate>=1.2"]
dev = ["pytest>=8.0", "ruff>=0.9"]

[project.scripts]
nature2music = "nature2music.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

